            <text x="15" y="0" font-size="14" class="muted">STATUS   :</text>
            <text x="100" y="0" font-size="14" font-weight="bold">[ <tspan class="neon pulsing">ONLINE</tspan> // BUILDING &amp; SHIPPING ]</text>

            <text x="15" y="25" font-size="14" class="muted">LOCATION :</text>
            <text x="100" y="25" font-size="14">Medellín, Colombia</text>

            <text x="15" y="50" font-size="14" class="muted">ROLE     :</text>
            <text x="100" y="50" font-size="14">Trainee Coder @ Riwi / Computer Engineering Student</text>

            <text x="15" y="75" font-size="14" class="muted">ENGLISH  :</text>
            <text x="100" y="75" font-size="14" font-weight="bold" class="primary">B2 (Intermediate) - APTIS</text>
        </g>

        <g transform="translate(0, 220)">
            <rect x="0" y="0" width="500" height="110" fill="var(--blue-alpha)" stroke="var(--blue-primary)" stroke-width="1"/>
            <rect x="0" y="0" width="500" height="20" fill="var(--blue-primary)"/>
            <text x="10" y="14" font-size="12" font-weight="bold" class="white-text">./core/mission_statement.sh</text>

            <text x="15" y="45" font-size="14">I blend backend architecture with graphic design</text>
            <text x="15" y="65" font-size="14">principles to engineer software that is highly</text>
            <text x="15" y="85" font-size="14"><tspan class="primary" font-weight="bold">scalable, intuitive, and visually compelling.</tspan></text>
            <text x="15" y="105" font-size="14">I view code as a medium for both logic and art.</text>
        </g>

