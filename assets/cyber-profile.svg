                <text x="30" y="84" font-size="13" font-weight="bold">REST APIs &amp; Postman</text>
                <text x="30" y="114" font-size="13" font-weight="bold">SQL &amp; PostgreSQL</text>
                <text x="30" y="144" font-size="13" font-weight="bold">ETL Data Pipelines</text>
                <text x="30" y="174" font-size="13" font-weight="bold">IBM Database Admin</text>

                <circle cx="15" cy="50" r="4" fill="none" stroke="var(--blue-neon)" stroke-width="1.5"/><circle cx="15" cy="80" r="4" fill="none" stroke="var(--blue-neon)" stroke-width="1.5"/><circle cx="15" cy="110" r="4" fill="none" stroke="var(--blue-neon)" stroke-width="1.5"/><circle cx="15" cy="140" r="4" fill="none" stroke="var(--blue-neon)" stroke-width="1.5"/><circle cx="15" cy="170" r="4" fill="none" stroke="var(--blue-neon)" stroke-width="1.5"/>
            </g>

            <g transform="translate(260, 20)">
                <rect x="0" y="0" width="240" height="180" class="bg-rect"/>
                <rect x="0" y="0" width="240" height="30" fill="var(--blue-primary)"/>
                <text x="10" y="20" font-size="13" font-weight="bold" class="white-text">FRONTEND &amp; UI/UX</text>

                <text x="30" y="54" font-size="13" font-weight="bold">Next.js &amp; React</text>
                <text x="30" y="84" font-size="13" font-weight="bold">TypeScript / JS</text>
                <text x="30" y="114" font-size="13" font-weight="bold">Tailwind CSS</text>
                <text x="30" y="144" font-size="13" font-weight="bold">Figma &amp; Illustrator</text>
                <text x="30" y="174" font-size="13" font-weight="bold">Agile Methodologies</text>

                <rect x="12" y="47" width="6" height="6" fill="var(--blue-primary)"/><rect x="12" y="77" width="6" height="6" fill="var(--blue-primary)"/><rect x="12" y="107" width="6" height="6" fill="var(--blue-primary)"/><rect x="12" y="137" width="6" height="6" fill="var(--blue-primary)"/><rect x="12" y="167" width="6" height="6" fill="var(--blue-primary)"/>
            </g>
        </g>
    </g>

    <g transform="translate(40, 650)">

        <text x="0" y="0" font-size="18" font-weight="bold" letter-spacing="1px">> DEPLOYED_ASSETS // PINNED_REPOSITORIES</text>
        <path d="M 0 10 L 870 10" fill="none" stroke="var(--blue-primary)" stroke-width="1" stroke-dasharray="4,4"/>

        <g transform="translate(0, 30)">
            <rect x="0" y="0" width="425" height="130" class="bg-rect" fill="var(--blue-alpha)"/>
            <rect x="0" y="0" width="425" height="30" fill="var(--blue-primary)"/>
            <text x="10" y="20" font-size="13" font-weight="bold" class="white-text">[*] PROMISE - AI AGENTS PLATFORM</text>

            <text x="15" y="55" font-size="13" class="neon" font-weight="bold">🏆 1st Place Riwi Hackathon</text>
            <text x="15" y="75" font-size="12" class="muted">Tech: Full Stack / JS / Integrations</text>
            <text x="15" y="95" font-size="13">Developed a platform focused on AI agent</text>
            <text x="15" y="115" font-size="13">interaction, managing complex data flows.</text>
        </g>

        <g transform="translate(445, 30)">
            <rect x="0" y="0" width="425" height="130" class="bg-rect" fill="var(--blue-alpha)"/>
            <rect x="0" y="0" width="425" height="30" fill="var(--blue-primary)"/>
            <text x="10" y="20" font-size="13" font-weight="bold" class="white-text">[*] KITCHEN IQ (API &amp; UI)</text>

            <text x="15" y="55" font-size="13" class="neon" font-weight="bold">Back-Office System for Restaurants</text>
            <text x="15" y="75" font-size="12" class="muted">Tech: Java, Spring Boot, TypeScript</text>
            <text x="15" y="95" font-size="13">Core system to optimize internal operations,</text>
            <text x="15" y="115" font-size="13">automating inventory, orders &amp; finances.</text>
        </g>

        <g transform="translate(0, 180)">
            <rect x="0" y="0" width="425" height="110" class="bg-rect" fill="var(--blue-alpha)"/>
            <rect x="0" y="0" width="425" height="30" fill="var(--blue-primary)"/>
            <text x="10" y="20" font-size="13" font-weight="bold" class="white-text">[*] HORUS-BRASLET</text>

            <text x="15" y="55" font-size="13" class="neon" font-weight="bold">Wearable / Hardware Integration</text>
            <text x="15" y="75" font-size="12" class="muted">Tech: TypeScript</text>
            <text x="15" y="95" font-size="13">Logic and interface implementation for</text>
        </g>

        <g transform="translate(445, 180)">
            <rect x="0" y="0" width="425" height="110" class="bg-rect" fill="var(--blue-alpha)"/>
            <rect x="0" y="0" width="425" height="30" fill="var(--blue-primary)"/>
            <text x="10" y="20" font-size="13" font-weight="bold" class="white-text">[*] SOFIA-INTEGRAL</text>

            <text x="15" y="55" font-size="13" class="neon" font-weight="bold">Comprehensive AI Assistant</text>
            <text x="15" y="75" font-size="12" class="muted">Tech: JavaScript</text>
            <text x="15" y="95" font-size="13">Ecosystem designed for intelligent</text>
        </g>

    </g>

</svg>
