<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 720" width="100%" height="100%">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');

            :root {
            /* LIGHT MODE - Blueprint/Corporate Sci-Fi */
            --bg-color: #e2e8f0;
            --grid-color: #cbd5e1;
            --panel-bg: #f8fafc;
            --border-main: #0f172a;
            --text-main: #0f172a;
            --text-muted: #475569;

            /* The Blue Palette */
            --blue-primary: #1d4ed8;
            --blue-bright: #2563eb;
            --blue-neon: #3b82f6;
            --blue-dark: #1e3a8a;
            }

            @media (prefers-color-scheme: dark) {
            :root {
            /* DARK MODE - Deep Space / Cyber-Terminal */
            --bg-color: #020617;
            --grid-color: #0f172a;
            --panel-bg: #0b1120;
            --border-main: #38bdf8;
            --text-main: #e0f2fe;
            --text-muted: #7dd3fc;

            /* The Blue Palette */
            --blue-primary: #0284c7;
            --blue-bright: #0ea5e9;
            --blue-neon: #38bdf8;
            --blue-dark: #075985;
            }
            }

            text {
            font-family: 'Share Tech Mono', monospace, 'Courier New';
            fill: var(--text-main);
            }

            .text-neon { fill: var(--blue-neon); }
            .text-primary { fill: var(--blue-primary); }
            .text-muted { fill: var(--text-muted); }

            .pixel-dark { fill: var(--text-main); }
            .pixel-blue { fill: var(--blue-neon); }
            .pixel-mid { fill: var(--blue-primary); }

            /* Animaciones */
            @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
            .cursor { animation: blink 1s step-end infinite; fill: var(--blue-neon); }

            @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
            .floating { animation: float 4s ease-in-out infinite; }
        </style>

        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="var(--grid-color)" stroke-width="1" />
            <circle cx="20" cy="20" r="1" fill="var(--blue-dark)" opacity="0.5"/>
        </pattern>
    </defs>

    <rect width="100%" height="100%" fill="var(--bg-color)" />
    <rect width="100%" height="100%" fill="url(#grid)" />

    <rect x="20" y="20" width="60" height="680" fill="var(--blue-dark)" stroke="var(--border-main)" stroke-width="2"/>

    <g transform="translate(40, 680) rotate(-90)">
        <text x="20" y="15" font-size="38" font-weight="bold" fill="var(--panel-bg)" letter-spacing="8px">E.A.V_OS</text>
        <text x="350" y="10" font-size="14" fill="var(--blue-neon)" letter-spacing="3px">v.2026 // KNOWLEDGE_BASE</text>
    </g>

    <g transform="translate(30, 40)">
        <rect x="0" y="0" width="40" height="3" fill="var(--blue-neon)"/>
        <rect x="0" y="10" width="40" height="3" fill="var(--blue-neon)"/>
        <rect x="0" y="20" width="40" height="3" fill="var(--blue-neon)"/>
    </g>

    <path d="M 100 20 L 830 20 L 830 700 L 100 700 Z" fill="var(--panel-bg)" stroke="var(--border-main)" stroke-width="2"/>

    <rect x="100" y="20" width="730" height="30" fill="var(--border-main)"/>
    <text x="120" y="40" font-size="14" font-weight="bold" fill="var(--bg-color)">./sys_profile.sh</text>
    <text x="730" y="40" font-size="14" fill="var(--bg-color)">[ _ □ X ]</text>

    <text x="110" y="80" font-size="16" class="text-neon">+</text>
    <text x="810" y="80" font-size="16" class="text-neon">+</text>
    <text x="110" y="680" font-size="16" class="text-neon">+</text>
    <text x="810" y="680" font-size="16" class="text-neon">+</text>

    <g transform="translate(140, 100) scale(4)" class="floating">
        <path d="M 1 10 L 15 5 L 30 10 L 30 22 L 15 27 L 1 22 Z" fill="var(--blue-dark)"/>
        <path d="M 2 11 L 15 6 L 29 11 L 29 21 L 15 26 L 2 21 Z" fill="var(--bg-color)"/>
        <path d="M 3 13 L 14 9 M 16 9 L 28 13 M 3 15 L 14 11 M 16 11 L 28 15 M 3 17 L 14 13 M 16 13 L 28 17 M 3 19 L 14 15 M 16 15 L 28 19" stroke="var(--blue-primary)" stroke-width="0.5"/>
        <path d="M 14 6 L 16 6 L 16 26 L 14 26 Z" fill="var(--blue-neon)"/>
        <rect x="15" y="1" width="1" height="1" class="pixel-blue"/>
        <rect x="18" y="2" width="1" height="1" class="pixel-mid"/>
        <rect x="12" y="3" width="1" height="1" class="pixel-dark"/>
        <rect x="22" y="-1" width="1" height="1" class="pixel-blue"/>
        <rect x="8" y="0" width="1" height="1" class="pixel-mid"/>
    </g>

    <g transform="translate(320, 110)">
        <text x="0" y="0" font-size="32" font-weight="bold" letter-spacing="1px">EMMANUEL ARANGO V.</text>

        <rect x="0" y="15" width="450" height="2" fill="var(--blue-neon)"/>

        <text x="0" y="35" font-size="16" class="text-neon" font-weight="bold">>> FULL STACK DEVELOPER &amp; CREATIVE ENGINEER</text>

        <text x="0" y="65" font-size="14" class="text-muted">STATUS   :</text>
        <text x="80" y="65" font-size="14" font-weight="bold">[ <tspan class="text-neon">ONLINE</tspan> // BUILDING &amp; SHIPPING ]</text>

        <text x="0" y="85" font-size="14" class="text-muted">LOCATION :</text>
        <text x="80" y="85" font-size="14">Medellín, Colombia</text>

        <text x="0" y="105" font-size="14" class="text-muted">ROLE     :</text>
        <text x="80" y="105" font-size="14">Trainee Coder @ Riwi / Computer Engineering Student</text>
    </g>

    <rect x="130" y="245" width="670" height="90" fill="var(--text-main)" opacity="0.05" stroke="var(--blue-primary)" stroke-width="1" stroke-dasharray="4,4"/>
    <g transform="translate(150, 265)">
        <text x="0" y="0" font-size="14" font-weight="bold" class="text-neon">root@eav:~# cat mission_statement.txt</text>
        <text x="0" y="25" font-size="14">I blend backend logic with graphic design principles to engineer</text>
        <text x="0" y="45" font-size="14">software that is both <tspan font-weight="bold" class="text-primary">scalable</tspan> and <tspan font-weight="bold" class="text-primary">visually brutal</tspan>.</text>
        <text x="0" y="65" font-size="14">Currently focused on Java, Spring Boot, and Next.js ecosystems.</text>
    </g>

    <g transform="translate(130, 360)">
        <text x="0" y="0" font-size="18" font-weight="bold" letter-spacing="2px">> SYSTEM_MODULES // STACK</text>
        <rect x="0" y="10" width="670" height="1" fill="var(--border-main)"/>

        <g transform="translate(0, 30)">
            <g stroke="var(--blue-neon)" stroke-width="2" fill="none">
                <ellipse cx="20" cy="15" rx="15" ry="5"/>
                <path d="M 5 15 L 5 35 A 15 5 0 0 0 35 35 L 35 15"/>
                <path d="M 5 25 A 15 5 0 0 0 35 25"/>
            </g>
            <text x="50" y="20" font-size="15" font-weight="bold" class="text-primary">BACKEND &amp; DATA PIPELINES</text>

            <g transform="translate(50, 35)">
                <rect x="0" y="0" width="60" height="20" fill="var(--blue-dark)" rx="2"/>
                <text x="30" y="14" font-size="12" fill="#fff" text-anchor="middle">JAVA</text>

                <rect x="70" y="0" width="100" height="20" fill="var(--blue-dark)" rx="2"/>
                <text x="120" y="14" font-size="12" fill="#fff" text-anchor="middle">SPRING BOOT</text>

                <rect x="180" y="0" width="45" height="20" fill="var(--blue-dark)" rx="2"/>
                <text x="202" y="14" font-size="12" fill="#fff" text-anchor="middle">SQL</text>

                <rect x="235" y="0" width="90" height="20" fill="var(--blue-dark)" rx="2"/>
                <text x="280" y="14" font-size="12" fill="#fff" text-anchor="middle">POSTGRESQL</text>

                <rect x="335" y="0" width="45" height="20" fill="var(--blue-dark)" rx="2"/>
                <text x="357" y="14" font-size="12" fill="#fff" text-anchor="middle">ETL</text>
            </g>
        </g>

        <g transform="translate(0, 110)">
            <g stroke="var(--blue-neon)" stroke-width="2" fill="none">
                <rect x="5" y="5" width="30" height="30" rx="2"/>
                <path d="M 5 15 L 35 15"/>
                <circle cx="10" cy="10" r="1" fill="var(--blue-neon)"/>
                <circle cx="15" cy="10" r="1" fill="var(--blue-neon)"/>
            </g>
            <text x="50" y="20" font-size="15" font-weight="bold" class="text-primary">FRONTEND &amp; DESIGN</text>

            <g transform="translate(50, 35)">
                <rect x="0" y="0" width="75" height="20" fill="var(--blue-dark)" rx="2"/>
                <text x="37" y="14" font-size="12" fill="#fff" text-anchor="middle">NEXT.JS</text>

                <rect x="85" y="0" width="95" height="20" fill="var(--blue-dark)" rx="2"/>
                <text x="132" y="14" font-size="12" fill="#fff" text-anchor="middle">TYPESCRIPT</text>

                <rect x="190" y="0" width="55" height="20" fill="var(--blue-dark)" rx="2"/>
                <text x="217" y="14" font-size="12" fill="#fff" text-anchor="middle">REACT</text>

                <rect x="255" y="0" width="85" height="20" fill="var(--blue-dark)" rx="2"/>
                <text x="297" y="14" font-size="12" fill="#fff" text-anchor="middle">TAILWIND</text>

                <rect x="350" y="0" width="60" height="20" fill="var(--blue-dark)" rx="2"/>
                <text x="380" y="14" font-size="12" fill="#fff" text-anchor="middle">FIGMA</text>
            </g>
        </g>

        <g transform="translate(0, 190)">
            <g stroke="var(--blue-neon)" stroke-width="2" fill="none">
                <path d="M 8 10 L 15 17 L 8 24"/>
                <path d="M 18 24 L 30 24"/>
            </g>
            <text x="50" y="20" font-size="15" font-weight="bold" class="text-primary">WORKFLOW &amp; CREDENTIALS</text>

            <g transform="translate(50, 35)">
                <rect x="0" y="0" width="45" height="20" fill="var(--blue-dark)" rx="2"/>
                <text x="22" y="14" font-size="12" fill="#fff" text-anchor="middle">GIT</text>

                <rect x="55" y="0" width="95" height="20" fill="var(--blue-dark)" rx="2"/>
                <text x="102" y="14" font-size="12" fill="#fff" text-anchor="middle">AGILE/SCRUM</text>

                <rect x="160" y="0" width="230" height="20" fill="none" stroke="var(--blue-neon)" stroke-width="1" rx="2"/>
                <text x="275" y="14" font-size="11" class="text-neon" text-anchor="middle">IBM DATA ENGINEERING CERT.</text>

                <rect x="400" y="0" width="130" height="20" fill="none" stroke="var(--blue-neon)" stroke-width="1" rx="2"/>
                <text x="465" y="14" font-size="11" class="text-neon" text-anchor="middle">APTIS ENGLISH B2</text>
            </g>
        </g>
    </g>

    <line x1="100" y1="650" x2="830" y2="650" stroke="var(--border-main)" stroke-width="2" />
    <rect x="120" y="665" width="12" height="12" fill="var(--blue-neon)"/>
    <text x="140" y="676" font-size="14" font-weight="bold">arango@host:~/github$ <tspan class="cursor">█</tspan></text>

    <text x="680" y="676" font-size="12" class="text-muted">MEMORY: OK // SECURE</text>
</svg>
