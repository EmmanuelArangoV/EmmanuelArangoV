<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 950" width="100%" height="100%">
    <defs>
        <style>
            :root {
            /* MODO CLARO */
            --bg-color: #f1f5f9;
            --grid-line: #cbd5e1;
            --panel-bg: #ffffff;
            --border-main: #0f172a;
            --text-main: #0f172a;
            --text-muted: #64748b;

            /* Paleta Azul */
            --blue-primary: #1d4ed8;
            --blue-bright: #2563eb;
            --blue-neon: #3b82f6;
            --blue-dark: #1e3a8a;
            --blue-alpha: rgba(59, 130, 246, 0.1);
            }

            @media (prefers-color-scheme: dark) {
            :root {
            /* MODO OSCURO */
            --bg-color: #020617;
            --grid-line: #0f172a;
            --panel-bg: #0b1120;
            --border-main: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #7dd3fc;

            /* Paleta Azul Cyberpunk */
            --blue-primary: #0284c7;
            --blue-bright: #0ea5e9;
            --blue-neon: #38bdf8;
            --blue-dark: #075985;
            --blue-alpha: rgba(56, 189, 248, 0.1);
            }
            }

            /* Fuentes Nativas de Terminal (A prueba de Overflow) */
            text {
            font-family: 'Courier New', Consolas, Monaco, 'Andale Mono', 'Ubuntu Mono', monospace;
            fill: var(--text-main);
            }

            .pixel-title { font-size: 32px; font-weight: bold; letter-spacing: -1px; }
            .pixel-subtitle { font-size: 15px; font-weight: bold; }
            .pixel-text { font-size: 13px; font-weight: bold; }

            .pixel-list { font-size: 13px; font-weight: normal; letter-spacing: -0.5px; }
            .pixel-small { font-size: 12px; font-weight: normal; letter-spacing: -0.5px; }
            .bold-text { font-weight: bold; }

            .neon { fill: var(--blue-neon); }
            .primary { fill: var(--blue-primary); }
            .muted { fill: var(--text-muted); }
            .white-text { fill: #ffffff; }

            .bg-rect { fill: var(--panel-bg); stroke: var(--blue-primary); stroke-width: 1.5; }
            .filled-rect { fill: var(--blue-primary); }

            /* Animaciones */
            @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            }
            .floating { animation: float 6s ease-in-out infinite; }

            @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.2; }
            }
            .pulsing { animation: pulse 3s infinite; }

            .project-card { transition: all 0.3s ease; cursor: pointer; }
            .project-card:hover { transform: scale(1.01) translateY(-2px); }
            .project-card:hover .project-bg { fill: var(--blue-alpha); stroke: var(--blue-neon); stroke-width: 2px;}
        </style>

        <pattern id="main-grid" width="30" height="30" patternUnits="userSpaceOnUse">
            <path d="M 30 0 L 0 0 0 30" fill="none" stroke="var(--grid-line)" stroke-width="0.5" />
        </pattern>

        <pattern id="dot-grid" width="10" height="10" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="var(--blue-dark)" opacity="0.3"/>
        </pattern>
    </defs>

    <rect width="100%" height="100%" fill="var(--bg-color)" />
    <rect width="100%" height="100%" fill="url(#main-grid)" />

    <rect x="20" y="20" width="910" height="910" fill="none" stroke="var(--border-main)" stroke-width="1"/>
    <path d="M 15 25 L 25 25 M 25 15 L 25 25" stroke="var(--border-main)" stroke-width="3" fill="none"/>
    <path d="M 935 25 L 925 25 M 925 15 L 925 25" stroke="var(--border-main)" stroke-width="3" fill="none"/>
    <path d="M 15 930 L 25 930 M 25 920 L 25 930" stroke="var(--border-main)" stroke-width="3" fill="none"/>
    <path d="M 935 930 L 925 930 M 925 920 L 925 930" stroke="var(--border-main)" stroke-width="3" fill="none"/>

    <g transform="translate(40, 40)">
        <rect x="0" y="0" width="340" height="545" fill="var(--panel-bg)" stroke="var(--border-main)" stroke-width="2"/>
        <rect x="0" y="0" width="340" height="545" fill="url(#dot-grid)"/>

        <rect x="0" y="0" width="340" height="30" fill="var(--border-main)"/>
        <text x="15" y="20" font-size="14" fill="var(--bg-color)" font-weight="bold">FIG. 01 // KNOWLEDGE_PRISM</text>

        <rect x="20" y="50" width="300" height="475" fill="none" stroke="var(--blue-primary)" stroke-width="1" stroke-dasharray="2,2"/>

        <g transform="translate(170, 360)">
            <circle cx="0" cy="-50" r="100" fill="none" stroke="var(--blue-dark)" stroke-width="0.5" opacity="0.5"/>
            <line x1="-120" y1="-50" x2="120" y2="-50" stroke="var(--blue-dark)" stroke-width="0.5" opacity="0.5"/>
            <line x1="0" y1="-180" x2="0" y2="80" stroke="var(--blue-dark)" stroke-width="0.5" opacity="0.5"/>

            <polygon points="-80,-10 0,20 80,-10 0,-40" fill="var(--blue-dark)" opacity="0.3"/>
            <polygon points="-75,-20 0,0 -5,-30 -80,-50" fill="var(--panel-bg)" stroke="var(--border-main)" stroke-width="1.5"/>
            <polygon points="75,-20 0,0 5,-30 80,-50" fill="var(--panel-bg)" stroke="var(--border-main)" stroke-width="1.5"/>
            <polygon points="-5,-30 0,0 5,-30 0,-35" fill="var(--blue-neon)"/>

            <g class="floating">
                <polygon points="0,-160 30,-120 0,-80 -30,-120" fill="var(--blue-alpha)" stroke="var(--blue-neon)" stroke-width="2"/>
                <polygon points="0,-160 0,-80 -30,-120" fill="var(--blue-neon)" opacity="0.2"/>
                <ellipse cx="0" cy="-120" rx="45" ry="10" fill="none" stroke="var(--border-main)" stroke-width="1.5" stroke-dasharray="4,4"/>
            </g>
        </g>

        <text x="40" y="515" font-size="12" font-weight="bold" class="muted">SYS_RENDER // EAV_ENGINEERING</text>
    </g>

    <g transform="translate(410, 50)">

        <g transform="translate(0, 30)">
            <text x="3" y="3" class="pixel-title" fill="var(--blue-dark)" opacity="0.4">EMMANUEL ARANGO</text>
            <text x="0" y="0" class="pixel-title" fill="var(--text-main)">EMMANUEL ARANGO</text>
        </g>

        <path d="M 0 50 L 400 50 L 415 65 L 500 65" fill="none" stroke="var(--blue-neon)" stroke-width="2"/>
        <circle cx="500" cy="65" r="3" fill="var(--blue-neon)"/>

        <text x="0" y="75" class="pixel-subtitle primary">>> FULL STACK DEVELOPER &amp; DESIGNER</text>

        <g transform="translate(0, 110)">
            <rect x="0" y="-12" width="5" height="90" fill="var(--border-main)"/>
            <text x="15" y="0" class="pixel-text muted">STATUS   :</text>
            <text x="100" y="0" class="pixel-text">[ <tspan class="neon pulsing">ONLINE</tspan> // BUILDING &amp; SHIPPING ]</text>

            <text x="15" y="25" class="pixel-text muted">LOCATION :</text>
            <text x="100" y="25" class="pixel-text">Medellín, Colombia</text>

            <text x="15" y="50" class="pixel-text muted">ROLE     :</text>
            <text x="100" y="50" class="pixel-text primary bold-text">Computer Engineering Student | Coder @ Riwi</text>

            <text x="15" y="75" class="pixel-text muted">ENGLISH  :</text>
            <text x="100" y="75" class="pixel-text">B2 (Intermediate) - APTIS Certified</text>
        </g>

        <g transform="translate(0, 210)">
            <rect x="0" y="0" width="500" height="135" fill="var(--blue-alpha)" stroke="var(--blue-primary)" stroke-width="1"/>
            <rect x="0" y="0" width="500" height="25" class="filled-rect"/>
            <text x="10" y="17" class="pixel-text white-text">./core/mission_statement.sh</text>

            <text x="15" y="55" class="pixel-list">I engineer robust backend architectures and fuse them</text>
            <text x="15" y="75" class="pixel-list">with precise, user-centric graphic design principles.</text>
            <text x="15" y="95" class="pixel-list">Code is my medium for uncompromising logic and art,</text>
            <text x="15" y="115" class="pixel-list">resulting in <tspan class="primary bold-text">scalable and intuitive systems.</tspan></text>
        </g>

        <g transform="translate(0, 370)">
            <text x="0" y="0" class="pixel-text">> SYSTEM_ARCHITECTURE</text>

            <g transform="translate(0, 15)">
                <rect x="0" y="0" width="240" height="150" class="bg-rect"/>
                <rect x="0" y="0" width="240" height="30" class="filled-rect"/>
                <text x="10" y="20" class="pixel-text white-text">BACKEND &amp; DATA</text>

                <text x="30" y="60" class="pixel-list bold-text">Java &amp; Spring Boot</text>
                <text x="30" y="85" class="pixel-list">RESTful APIs</text>
                <text x="30" y="110" class="pixel-list">SQL &amp; PostgreSQL</text>
                <text x="30" y="135" class="pixel-list">ETL Data Pipelines</text>

                <circle cx="15" cy="56" r="4" fill="none" stroke="var(--blue-neon)" stroke-width="1.5"/>
                <circle cx="15" cy="81" r="4" fill="none" stroke="var(--blue-neon)" stroke-width="1.5"/>
                <circle cx="15" cy="106" r="4" fill="none" stroke="var(--blue-neon)" stroke-width="1.5"/>
                <circle cx="15" cy="131" r="4" fill="none" stroke="var(--blue-neon)" stroke-width="1.5"/>
            </g>

            <g transform="translate(260, 15)">
                <rect x="0" y="0" width="240" height="150" class="bg-rect"/>
                <rect x="0" y="0" width="240" height="30" class="filled-rect"/>
                <text x="10" y="20" class="pixel-text white-text">FRONTEND &amp; UI/UX</text>

                <text x="30" y="60" class="pixel-list bold-text">Next.js &amp; React</text>
                <text x="30" y="85" class="pixel-list">TypeScript &amp; JS</text>
                <text x="30" y="110" class="pixel-list">Tailwind CSS</text>
                <text x="30" y="135" class="pixel-list">Figma &amp; UI Design</text>

                <rect x="12" y="53" width="6" height="6" class="filled-rect"/>
                <rect x="12" y="78" width="6" height="6" class="filled-rect"/>
                <rect x="12" y="103" width="6" height="6" class="filled-rect"/>
                <rect x="12" y="128" width="6" height="6" class="filled-rect"/>
            </g>
        </g>
    </g>

    <g transform="translate(40, 610)">

        <text x="0" y="0" class="pixel-text" letter-spacing="1px">> DEPLOYED_ASSETS // PINNED_REPOSITORIES</text>
        <path d="M 0 15 L 870 15" fill="none" stroke="var(--blue-primary)" stroke-width="1" stroke-dasharray="4,4"/>

        <a href="https://github.com/EmmanuelArangoV/Promise" target="_blank">
            <g transform="translate(0, 35)" class="project-card">
                <rect x="0" y="0" width="425" height="130" class="bg-rect project-bg"/>
                <rect x="0" y="0" width="425" height="30" class="filled-rect"/>
                <text x="10" y="20" class="pixel-text white-text">[*] PROMISE - AI AGENTS PLATFORM</text>

                <text x="15" y="56" class="pixel-text neon">🏆 1st Place Capstone Project</text>
                <text x="15" y="80" class="pixel-small muted bold-text">Tech: Full Stack Environment</text>
                <text x="15" y="104" class="pixel-small">Engineered a seamless system for autonomous AI agents.</text>
            </g>
        </a>

        <a href="https://github.com/EmmanuelArangoV/Kitchen-IQ" target="_blank">
            <g transform="translate(445, 35)" class="project-card">
                <rect x="0" y="0" width="425" height="130" class="bg-rect project-bg"/>
                <rect x="0" y="0" width="425" height="30" class="filled-rect"/>
                <text x="10" y="20" class="pixel-text white-text">[*] KITCHEN IQ (ENTERPRISE API)</text>

                <text x="15" y="56" class="pixel-text neon">Enterprise Back-Office Architecture</text>
                <text x="15" y="80" class="pixel-small muted bold-text">Tech: Java, Spring Boot, PostgreSQL</text>
                <text x="15" y="104" class="pixel-small">Scalable system designed to automate restaurant logistics.</text>
            </g>
        </a>

        <a href="https://github.com/mcastaneda846/horus-braslet" target="_blank">
            <g transform="translate(0, 185)" class="project-card">
                <rect x="0" y="0" width="425" height="130" class="bg-rect project-bg"/>
                <rect x="0" y="0" width="425" height="30" class="filled-rect"/>
                <text x="10" y="20" class="pixel-text white-text">[*] HORUS-BRASLET</text>

                <text x="15" y="56" class="pixel-text neon">Hardware-Software Synchronization</text>
                <text x="15" y="80" class="pixel-small muted bold-text">Tech: Wearable Integration / TypeScript</text>
                <text x="15" y="104" class="pixel-small">Core logic implementation for wearable telemetry tech.</text>
            </g>
        </a>

        <a href="https://github.com/EmmanuelArangoV/SofIA-Integral" target="_blank">
            <g transform="translate(445, 185)" class="project-card">
                <rect x="0" y="0" width="425" height="130" class="bg-rect project-bg"/>
                <rect x="0" y="0" width="425" height="30" class="filled-rect"/>
                <text x="10" y="20" class="pixel-text white-text">[*] SOFIA-INTEGRAL</text>

                <text x="15" y="56" class="pixel-text neon">Cognitive AI Assistant Ecosystem</text>
                <text x="15" y="80" class="pixel-small muted bold-text">Tech: JavaScript / API Architecture</text>
                <text x="15" y="104" class="pixel-small">Intelligent workflows leveraging JS for data routing.</text>
            </g>
        </a>

    </g>

</svg>
