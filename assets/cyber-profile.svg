<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 1020" width="100%" height="100%">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;family=Press+Start+2P&amp;display=swap');

            :root {
            /* MODO CLARO */
            --bg-color: #f1f5f9;
            --grid-line: #cbd5e1;
            --panel-bg: #ffffff;
            --border-main: #0f172a;
            --text-main: #0f172a;
            --text-muted: #64748b;

            /* Paleta Azul */
            --blue-primary: #1d4ed8;
            --blue-bright: #2563eb;
            --blue-neon: #3b82f6;
            --blue-dark: #1e3a8a;
            --blue-alpha: rgba(59, 130, 246, 0.1);
            }

            @media (prefers-color-scheme: dark) {
            :root {
            /* MODO OSCURO */
            --bg-color: #020617;
            --grid-line: #0f172a;
            --panel-bg: #0b1120;
            --border-main: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #7dd3fc;

            /* Paleta Azul Cyberpunk */
            --blue-primary: #0284c7;
            --blue-bright: #0ea5e9;
            --blue-neon: #38bdf8;
            --blue-dark: #075985;
            --blue-alpha: rgba(56, 189, 248, 0.1);
            }
            }

            text {
            font-family: 'Share Tech Mono', monospace, 'Courier New';
            fill: var(--text-main);
            }

            .pixel-font { font-family: 'Press Start 2P', monospace; }
            .neon { fill: var(--blue-neon); }
            .primary { fill: var(--blue-primary); }
            .muted { fill: var(--text-muted); }
            .white-text { fill: #ffffff; }
            .bg-rect { fill: var(--panel-bg); stroke: var(--blue-primary); stroke-width: 1.5; }

            @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            }
            .floating { animation: float 6s ease-in-out infinite; }

            @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.2; }
            }
            .pulsing { animation: pulse 3s infinite; }
        </style>

        <pattern id="main-grid" width="30" height="30" patternUnits="userSpaceOnUse">
            <path d="M 30 0 L 0 0 0 30" fill="none" stroke="var(--grid-line)" stroke-width="0.5" />
        </pattern>

        <pattern id="dot-grid" width="10" height="10" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="var(--blue-dark)" opacity="0.3"/>
        </pattern>
    </defs>

    <rect width="100%" height="100%" fill="var(--bg-color)" />
    <rect width="100%" height="100%" fill="url(#main-grid)" />

    <rect x="20" y="20" width="910" height="980" fill="none" stroke="var(--border-main)" stroke-width="1"/>
    <path d="M 15 25 L 25 25 M 25 15 L 25 25" stroke="var(--border-main)" stroke-width="3" fill="none"/>
    <path d="M 935 25 L 925 25 M 925 15 L 925 25" stroke="var(--border-main)" stroke-width="3" fill="none"/>
    <path d="M 15 995 L 25 995 M 25 985 L 25 995" stroke="var(--border-main)" stroke-width="3" fill="none"/>
    <path d="M 935 995 L 925 995 M 925 985 L 925 995" stroke="var(--border-main)" stroke-width="3" fill="none"/>

    <g transform="translate(40, 40)">
        <rect x="0" y="0" width="340" height="570" fill="var(--panel-bg)" stroke="var(--border-main)" stroke-width="2"/>
        <rect x="0" y="0" width="340" height="570" fill="url(#dot-grid)"/>

        <rect x="0" y="0" width="340" height="30" fill="var(--border-main)"/>
        <text x="15" y="20" font-size="12" fill="var(--bg-color)" font-weight="bold">FIG. 01 // KNOWLEDGE_PRISM</text>

        <rect x="20" y="50" width="300" height="500" fill="none" stroke="var(--blue-primary)" stroke-width="1" stroke-dasharray="2,2"/>

        <g transform="translate(170, 380)">
            <circle cx="0" cy="-50" r="100" fill="none" stroke="var(--blue-dark)" stroke-width="0.5" opacity="0.5"/>
            <line x1="-120" y1="-50" x2="120" y2="-50" stroke="var(--blue-dark)" stroke-width="0.5" opacity="0.5"/>
            <line x1="0" y1="-180" x2="0" y2="80" stroke="var(--blue-dark)" stroke-width="0.5" opacity="0.5"/>

            <polygon points="-80,-10 0,20 80,-10 0,-40" fill="var(--blue-dark)" opacity="0.3"/>
            <polygon points="-75,-20 0,0 -5,-30 -80,-50" fill="var(--panel-bg)" stroke="var(--border-main)" stroke-width="1.5"/>
            <polygon points="75,-20 0,0 5,-30 80,-50" fill="var(--panel-bg)" stroke="var(--border-main)" stroke-width="1.5"/>
            <polygon points="-5,-30 0,0 5,-30 0,-35" fill="var(--blue-neon)"/>

            <g class="floating">
                <polygon points="0,-160 30,-120 0,-80 -30,-120" fill="var(--blue-alpha)" stroke="var(--blue-neon)" stroke-width="2"/>
                <polygon points="0,-160 0,-80 -30,-120" fill="var(--blue-neon)" opacity="0.2"/>
                <ellipse cx="0" cy="-120" rx="45" ry="10" fill="none" stroke="var(--border-main)" stroke-width="1.5" stroke-dasharray="4,4"/>
            </g>
        </g>

        <text x="40" y="535" font-size="10" class="muted">SYS_RENDER // EAV_ENGINEERING</text>
    </g>

    <g transform="translate(410, 50)">

        <g transform="translate(0, 30)">
            <text x="3" y="3" font-size="18" class="pixel-font" fill="var(--blue-dark)" opacity="0.4">EMMANUEL ARANGO</text>
            <text x="0" y="0" font-size="18" class="pixel-font" fill="var(--text-main)">EMMANUEL ARANGO</text>
        </g>

        <path d="M 0 50 L 400 50 L 415 65 L 500 65" fill="none" stroke="var(--blue-neon)" stroke-width="2"/>
        <circle cx="500" cy="65" r="3" fill="var(--blue-neon)"/>

        <text x="0" y="75" font-size="16" font-weight="bold" class="primary">>> FULL STACK DEVELOPER &amp; DESIGNER</text>

        <g transform="translate(0, 105)">
