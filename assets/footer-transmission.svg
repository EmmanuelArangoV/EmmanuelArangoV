<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 220" width="100%" height="100%">
    <defs>
        <style>
            :root {
            /* MODO CLARO */
            --bg-color: #f1f5f9;
            --grid-line: #cbd5e1;
            --panel-bg: #ffffff;
            --border-main: #0f172a;
            --text-main: #0f172a;
            --text-muted: #64748b;

            /* Paleta Azul */
            --blue-primary: #1d4ed8;
            --blue-bright: #2563eb;
            --blue-neon: #3b82f6;
            --blue-dark: #1e3a8a;
            --blue-alpha: rgba(59, 130, 246, 0.1);
            }

            @media (prefers-color-scheme: dark) {
            :root {
            /* MODO OSCURO */
            --bg-color: #020617;
            --grid-line: #0f172a;
            --panel-bg: #0b1120;
            --border-main: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #7dd3fc;

            /* Paleta Azul Cyberpunk */
            --blue-primary: #0284c7;
            --blue-bright: #0ea5e9;
            --blue-neon: #38bdf8;
            --blue-dark: #075985;
            --blue-alpha: rgba(56, 189, 248, 0.1);
            }
            }

            /* System Stack Font */
            text {
            font-family: 'Courier New', Consolas, Monaco, 'Andale Mono', 'Ubuntu Mono', monospace;
            fill: var(--text-main);
            }

            .pixel-title { font-size: 26px; font-weight: bold; letter-spacing: -1px; }
            .pixel-quote { font-size: 15px; font-style: italic; letter-spacing: -0.5px; }
            .pixel-text { font-size: 13px; font-weight: bold; letter-spacing: -0.5px; }
            .pixel-small { font-size: 11px; font-weight: normal; letter-spacing: 0.5px; }
            .bold-text { font-weight: bold; }

            .neon { fill: var(--blue-neon); }
            .primary { fill: var(--blue-primary); }
            .muted { fill: var(--text-muted); }
            .bg-color { fill: var(--bg-color); }

            /* Animaciones */
            @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
            }
            .cursor { animation: blink 1s step-end infinite; fill: var(--blue-neon); }

            @keyframes pulse-slow {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 0.3; }
            }
            .pulsing-slow { animation: pulse-slow 4s infinite; }
        </style>

        <pattern id="dot-grid" width="15" height="15" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="var(--blue-dark)" opacity="0.3"/>
        </pattern>
        <pattern id="diagonal-stripes" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="5" height="10" fill="var(--blue-dark)" opacity="0.2"/>
        </pattern>
    </defs>

    <rect width="100%" height="100%" fill="none" />

    <g transform="translate(20, 20)">
        <rect x="5" y="5" width="910" height="180" fill="var(--blue-alpha)"/>

        <rect x="0" y="0" width="910" height="180" fill="var(--panel-bg)" stroke="var(--border-main)" stroke-width="2"/>
        <rect x="0" y="0" width="910" height="180" fill="url(#dot-grid)"/>

        <rect x="0" y="0" width="910" height="30" fill="var(--border-main)"/>

        <circle cx="20" cy="15" r="5" fill="var(--bg-color)" opacity="0.5"/>
        <circle cx="35" cy="15" r="5" fill="var(--bg-color)" opacity="0.5"/>
        <circle cx="50" cy="15" r="5" fill="var(--blue-neon)"/>

        <text x="70" y="19" class="pixel-text bg-color">sys_halt.exe // ROOT_ACCESS</text>

        <g transform="translate(730, 50)" class="pulsing-slow">
            <rect x="0" y="0" width="150" height="110" fill="none" stroke="var(--blue-dark)" stroke-width="1" stroke-dasharray="2,2"/>
            <rect x="10" y="10" width="130" height="90" fill="url(#diagonal-stripes)"/>
            <rect x="15" y="15" width="8" height="80" fill="var(--blue-primary)"/>
            <rect x="28" y="15" width="3" height="80" fill="var(--text-main)"/>
            <rect x="35" y="15" width="12" height="80" fill="var(--blue-neon)"/>
            <rect x="52" y="15" width="4" height="80" fill="var(--blue-dark)"/>
            <rect x="61" y="15" width="2" height="80" fill="var(--text-main)"/>
            <rect x="68" y="15" width="15" height="80" fill="var(--blue-primary)"/>
            <rect x="88" y="15" width="5" height="80" fill="var(--text-muted)"/>
            <rect x="98" y="15" width="18" height="80" fill="var(--blue-neon)"/>
            <rect x="121" y="15" width="4" height="80" fill="var(--blue-dark)"/>
            <rect x="15" y="45" width="110" height="20" fill="var(--panel-bg)"/>
            <text x="25" y="59" class="pixel-small primary bold-text">EAV-2026</text>
        </g>

        <g transform="translate(40, 75)">
            <text x="0" y="0" class="pixel-title">> END_OF_TRANSMISSION</text>
            <rect x="375" y="-20" width="14" height="24" class="cursor"/>

            <path d="M 0 15 L 200 15" fill="none" stroke="var(--blue-neon)" stroke-width="2"/>
            <circle cx="200" cy="15" r="3" fill="var(--blue-neon)"/>

            <text x="0" y="45" class="pixel-quote muted">"The future is already here — it's just not evenly distributed."</text>
            <text x="0" y="65" class="pixel-text primary bold-text">— William Gibson</text>

            <g transform="translate(0, 95)">
                <text x="0" y="0" class="pixel-small muted">DISCONNECTING...</text>
                <rect x="120" y="-8" width="200" height="8" fill="var(--bg-color)" stroke="var(--blue-dark)" stroke-width="1"/>
                <rect x="120" y="-8" width="200" height="8" fill="var(--blue-dark)" opacity="0.5"/>
                <rect x="120" y="-8" width="180" height="8" fill="var(--blue-neon)"/> <text x="330" y="0" class="pixel-small primary">100%</text>
            </g>
        </g>

        <path d="M 0 50 L 0 30" fill="none" stroke="var(--blue-neon)" stroke-width="3"/>
        <path d="M 910 150 L 910 180 L 880 180" fill="none" stroke="var(--blue-neon)" stroke-width="3"/>
    </g>

</svg>
